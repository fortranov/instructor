services:
  migration:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    environment:
      # URL базы данных - можно переопределить через переменную окружения
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/triplan.db}
    volumes:
      # Монтируем директорию с базой данных
      - ./:/data
      # Монтируем код приложения для миграций
      - ./backend:/app/backend
    command: ["python", "migration_runner.py"]
    restart: "no"  # Запускаем только один раз
    
  # Альтернативный сервис для PostgreSQL
  migration-postgres:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL:-postgresql://user:password@host:5432/triplan}
    command: ["python", "migration_runner.py"]
    restart: "no"
    profiles:
      - postgres
      
  # Альтернативный сервис для MySQL
  migration-mysql:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${MYSQL_URL:-mysql://user:password@host:3306/triplan}
    command: ["python", "migration_runner.py"]
    restart: "no"
    profiles:
      - mysql
